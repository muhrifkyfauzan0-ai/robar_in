<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBARIN - Pemesanan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img src="logo.png" alt="Logo ROBARIN" class="logo">
    <h1>ROBARIN</h1>
    <p class="slogan">Nikmatnya Bikin Balik Lagi</p>
</header>

<nav>
    <a href="index.html">Beranda</a>
    <a href="produk.html">Produk</a>
    <a href="pemesanan.html">Pemesanan</a>
</nav>

<section>
    <h2>Form Pemesanan</h2>

    <form>
        <label>Nama Lengkap</label>
        <input type="text" required>

        <label>No. HP</label>
        <input type="tel" required>

        <label>Pilih Produk</label>
        <select required>
            <option>Roti Bakar Cokelat</option>
            <option>Roti Bakar Keju</option>
            <option>Roti Bakar Cokelat Keju</option>
            <option>Roti Bakar Strawberry</option>
        </select>

        <label>Jumlah Pesanan</label>
        <input type="number" min="1" required>

        <label>Alamat Pengiriman</label>
        <textarea rows="4"></textarea>

        <button type="submit">Pesan Sekarang</button>
    </form>
</section>

<footer>
    <p>© 2026 ROBARIN - Nikmatnya Bikin Balik Lagi</p>
</footer>

</body>
</html>
